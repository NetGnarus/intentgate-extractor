[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intentgate-extractor"
version = "0.1.0"
description = "Intent extractor service for IntentGate"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "NetGnarus" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.110,<0.116",
  "uvicorn[standard]>=0.27,<0.32",
  "pydantic>=2.5,<3",
  "anthropic>=0.34,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.6,<1",
]

[project.urls]
Homepage = "https://github.com/NetGnarus/intentgate-extractor"
Source = "https://github.com/NetGnarus/intentgate-extractor"
Issues = "https://github.com/NetGnarus/intentgate-extractor/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, B = bugbear, UP = pyupgrade,
# SIM = flake8-simplify, N = pep8-naming.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N"]
# E501 (line-too-long) is handled by the formatter; ignore in linter.
ignore = ["E501"]
